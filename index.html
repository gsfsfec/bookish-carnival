<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>球球大乱斗 | 40人联机</title>
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background:#121212; color:#fff; overflow:hidden; }
        
        /* 公共容器 */
        .container { position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(22,22,22,0.95); border-radius:20px; padding:25px; box-shadow:0 0 30px rgba(0,0,0,0.7); }
        .title { font-size:28px; margin-bottom:25px; text-align:center; color:#4CAF50; }
        .input { width:100%; padding:15px; margin:10px 0; border:none; border-radius:12px; background:#333; color:#fff; font-size:18px; outline:none; }
        .input::placeholder { color:#999; }
        .file-input {
            width:100%; padding:12px; margin:10px 0; border:1px dashed #4CAF50;
            border-radius:12px; background:#333; color:#ccc; font-size:16px;
            cursor:pointer; display:flex; align-items:center; justify-content:center;
        }
        .file-input span { margin-left:8px; }
        .button { width:100%; padding:15px; margin:10px 0; border:none; border-radius:12px; background:#4CAF50; color:#fff; font-size:18px; font-weight:bold; cursor:pointer; transition:0.2s; }
        .button:hover { background:#45a049; }
        .button:disabled { background:#666; cursor:not-allowed; }
        .tip { font-size:14px; color:#ccc; margin-top:12px; text-align:center; }

        /* 大厅页面 */
        #lobby { display:block; width:320px; }
        #roomList { max-height:320px; overflow-y:auto; margin:20px 0; border-radius:12px; border:1px solid #444; }
        .room-item { padding:15px; border-bottom:1px solid #333; cursor:pointer; }
        .room-item:hover { background:#333; }
        .room-item:last-child { border-bottom:none; }
        .room-id { font-weight:bold; color:#4CAF50; font-size:16px; }
        .room-info { font-size:13px; color:#ccc; margin-top:6px; }

        /* 等待房间 */
        #waitingRoom { display:none; width:320px; text-align:center; }
        #playerList { max-height:280px; overflow-y:auto; margin:25px 0; padding:12px; border-radius:12px; background:#222; }
        .player-item { padding:10px 0; font-size:16px; border-bottom:1px solid #333; }
        .player-item:last-child { border-bottom:none; }
        .host-tag { color:#ff9800; font-size:13px; margin-left:6px; }

        /* 游戏界面 */
        #game { display:none; width:100vw; height:100vh; position:relative; }
        #gameCanvas { width:100%; height:100%; background:#121212; touch-action:none; }

        /* 排行榜 */
        #rankPanel { position:absolute; right:12px; top:12px; width:170px; background:rgba(0,0,0,0.7); border-radius:12px; padding:12px; max-height:85vh; overflow-y:auto; }
        .rank-item { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:14px; white-space:nowrap; }
        .rank-avatar { width:28px; height:28px; border-radius:50%; object-fit:cover; background:#444; }
        .rank-name { flex:1; overflow:hidden; text-overflow:ellipsis; }
        .rank-kill { color:#ff9800; font-weight:bold; }

        /* 顶部信息 */
        #topInfo { position:absolute; top:12px; left:12px; display:flex; gap:25px; font-size:18px; font-weight:bold; text-shadow:0 0 6px #000; z-index:10; }

        /* 虚拟摇杆 */
        .joystick { position:absolute; bottom:35px; left:35px; width:150px; height:150px; background:rgba(255,255,255,0.15); border-radius:50%; z-index:5; }
        .joystick-knob { position:absolute; top:50%; left:50%; width:55px; height:55px; background:#fff; border-radius:50%; transform:translate(-50%,-50%); z-index:6; }

        /* 加速按钮 */
        #boostBtn {
            position:absolute; bottom:35px; right:35px;
            width:90px; height:90px; background:#ff5722;
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:18px; font-weight:bold; color:#fff;
            z-index:10; user-select:none;
            box-shadow:0 0 15px rgba(255,87,34,0.5);
        }
    </style>
</head>
<body>
    <!-- 大厅页面 -->
    <div id="lobby" class="container">
        <h1 class="title">球球大乱斗</h1>
        <input id="playerName" class="input" placeholder="请输入你的昵称" value="球球玩家">
        <label class="file-input" for="avatarFile">
            <svg width="20" height="20" fill="#4CAF50" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <span>选择本地头像</span>
        </label>
        <input type="file" id="avatarFile" accept="image/png,image/jpg,image/jpeg" style="display:none;">
        <div id="avatarPreview" class="tip" style="margin-top:5px; color:#4CAF50;"></div>
        <button id="createRoomBtn" class="button">创建房间</button>
        <div class="tip">点击下方房间直接加入</div>
        <div id="roomList"></div>
    </div>

    <!-- 等待房间 -->
    <div id="waitingRoom" class="container">
        <h1 class="title">房间等待中</h1>
        <div id="roomInfo" class="tip"></div>
        <div id="playerList"></div>
        <button id="startGameBtn" class="button" style="background:#ff9800;">开始游戏（房主）</button>
        <button id="leaveRoomBtn" class="button" style="background:#f44336;">离开房间</button>
    </div>

    <!-- 游戏界面 -->
    <div id="game">
        <div id="topInfo">
            <div>重量: <span id="weightText">0</span></div>
            <div>血量: <span id="hpText">3</span></div>
            <div>击杀: <span id="killText">0</span></div>
        </div>
        <div id="rankPanel"></div>
        <canvas id="gameCanvas"></canvas>
        <div class="joystick"><div class="joystick-knob"></div></div>
        <div id="boostBtn">加速</div>
    </div>

    <script>
        // 核心配置
        const PUSHER_KEY = '34b4edd6678d7440e600';
        const PUSHER_CLUSTER = 'ap3';
        const MAP_SIZE = 5000;
        const NORMAL_SPEED = 5;
        const BOOST_SPEED = 10;
        const MAX_HP = 3;
        const MAX_PLAYERS = 40;
        const BALL_RADIUS = 45;
        const KNOCKBACK_DISTANCE = 120; // 大球被弹开的距离
        const KNOCKBACK_DURATION = 200; // 弹开动画时长（ms）

        // 画布初始化
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let canvasDPR = window.devicePixelRatio || 1;

        function resizeCanvas() {
            canvasDPR = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * canvasDPR;
            canvas.height = window.innerHeight * canvasDPR;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 全局状态
        let pusher, mainChannel, roomChannel;
        let playerId, playerName, playerAvatar = null;
        let currentRoomId = null;
        let isHost = false;
        let gameStarted = false;

        let rooms = {};
        let players = {};
        let foods = [];

        let moveX = 0, moveY = 0;
        let isBoost = false;
        let cameraX = 0, cameraY = 0;

        // 弹开动画状态
        let knockbackAnimations = {}; // { playerId: { startTime, fromX, fromY, toX, toY } }

        // 本地头像处理
        const avatarFile = document.getElementById('avatarFile');
        const avatarPreview = document.getElementById('avatarPreview');
        avatarFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                compressImage(event.target.result, (base64) => {
                    playerAvatar = base64;
                    avatarPreview.textContent = `已选择：${file.name}`;
                });
            };
            reader.readAsDataURL(file);
        });

        // 图片压缩函数
        function compressImage(base64, callback, quality = 0.5) {
            const img = new Image();
            img.src = base64;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const targetWidth = 100;
                const targetHeight = 100;
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                const compressed = canvas.toDataURL('image/jpeg', quality);
                callback(compressed);
            };
        }

        // 头像缓存
        const avatarCache = {};
        function loadAvatar(avatarData, cb) {
            if (!avatarData) return cb(null);
            if (avatarCache[avatarData]) return cb(avatarCache[avatarData]);
            const img = new Image();
            img.onload = () => { avatarCache[avatarData] = img; cb(img); };
            img.onerror = () => cb(null);
            img.src = avatarData;
        }

        // 工具函数
        function rndPos() {
            return { x: 200 + Math.random() * (MAP_SIZE - 400), y: 200 + Math.random() * (MAP_SIZE - 400) };
        }
        function rndColor() {
            return `hsl(${Math.random() * 360}, 80%, 60%)`;
        }
        function dist(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        // 初始化食物
        function initFood() {
            foods = [];
            for (let i = 0; i < 100; i++) {
                foods.push({ ...rndPos(), radius: 6, color: rndColor() });
            }
        }

        // 相机更新
        function updateCamera() {
            const me = players[playerId];
            if (!me) return;
            const cameraZoom = 0.8;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(cameraZoom * canvasDPR, cameraZoom * canvasDPR);
            cameraX = (canvas.width / (2 * cameraZoom * canvasDPR)) - me.x;
            cameraY = (canvas.height / (2 * cameraZoom * canvasDPR)) - me.y;
        }

        // 绘制核心
        function draw() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const me = players[playerId];
            if (!me) return;
            updateCamera();

            // 绘制地图边界
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 4 / (0.8 * canvasDPR);
            ctx.strokeRect(cameraX, cameraY, MAP_SIZE, MAP_SIZE);

            // 绘制食物
            foods.forEach(f => {
                ctx.beginPath();
                const grad = ctx.createRadialGradient(
                    f.x + cameraX, f.y + cameraY, 0,
                    f.x + cameraX, f.y + cameraY, f.radius
                );
                grad.addColorStop(0, f.color);
                grad.addColorStop(1, `${f.color}80`);
                ctx.fillStyle = grad;
                ctx.arc(f.x + cameraX, f.y + cameraY, f.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            });

            // 更新弹开动画
            const now = performance.now();
            for (const id in knockbackAnimations) {
                const anim = knockbackAnimations[id];
                const t = Math.min(1, (now - anim.startTime) / KNOCKBACK_DURATION);
                // 缓动函数：easeOutQuad，让动画更丝滑
                const easeT = t * (2 - t);
                if (players[id]) {
                    players[id].x = anim.fromX + (anim.toX - anim.fromX) * easeT;
                    players[id].y = anim.fromY + (anim.toY - anim.fromY) * easeT;
                }
                if (t >= 1) {
                    delete knockbackAnimations[id];
                }
            }

            // 绘制玩家
            for (const id in players) {
                const p = players[id];
                if (!p.alive) continue;
                const drawX = p.x + cameraX;
                const drawY = p.y + cameraY;

                // 绘制球体
                ctx.beginPath();
                const ballGrad = ctx.createRadialGradient(
                    drawX - BALL_RADIUS * 0.3, drawY - BALL_RADIUS * 0.3, 0,
                    drawX, drawY, BALL_RADIUS
                );
                ballGrad.addColorStop(0, id === playerId ? '#4CAF50' : p.color);
                ballGrad.addColorStop(1, id === playerId ? '#388E3C' : `${p.color}80`);
                ctx.fillStyle = ballGrad;
                ctx.arc(drawX, drawY, BALL_RADIUS, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2 / (0.8 * canvasDPR);
                ctx.stroke();
                ctx.closePath();

                // 绘制头像
                if (p.avatar) {
                    loadAvatar(p.avatar, (img) => {
                        if (!img) return;
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(drawX, drawY, BALL_RADIUS * 0.7, 0, Math.PI * 2);
                        ctx.clip();
                        ctx.drawImage(
                            img,
                            drawX - BALL_RADIUS * 0.7,
                            drawY - BALL_RADIUS * 0.7,
                            BALL_RADIUS * 1.4,
                            BALL_RADIUS * 1.4
                        );
                        ctx.restore();
                    });
                }

                // 头顶信息
                const nameTxt = p.name;
                const statTxt = `重量:${p.weight} | 血量:${p.hp}/${MAX_HP}`;
                ctx.font = `bold 18px Arial`;
                const nameWidth = ctx.measureText(nameTxt).width + 30;
                ctx.font = `16px Arial`;
                const statWidth = ctx.measureText(statTxt).width + 30;
                const infoWidth = Math.max(nameWidth, statWidth);

                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(drawX - infoWidth/2, drawY - BALL_RADIUS - 70, infoWidth, 30);
                ctx.fillStyle = '#fff';
                ctx.font = `bold 18px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText(nameTxt, drawX, drawY - BALL_RADIUS - 48);

                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(drawX - infoWidth/2, drawY - BALL_RADIUS - 40, infoWidth, 28);
                ctx.fillStyle = p.hp <= 1 ? '#ff3b30' : '#fff';
                ctx.font = `16px Arial`;
                ctx.fillText(statTxt, drawX, drawY - BALL_RADIUS - 18);
            }
        }

        // 游戏逻辑
        function gameLogic() {
            if (!gameStarted) return;
            const me = players[playerId];
            if (!me || !me.alive) return;

            const speed = isBoost ? BOOST_SPEED : NORMAL_SPEED;
            if (moveX || moveY) {
                const mag = Math.hypot(moveX, moveY);
                if (mag > 0) {
                    me.x += (moveX / mag) * speed;
                    me.y += (moveY / mag) * speed;
                }
                me.x = Math.max(BALL_RADIUS, Math.min(MAP_SIZE - BALL_RADIUS, me.x));
                me.y = Math.max(BALL_RADIUS, Math.min(MAP_SIZE - BALL_RADIUS, me.y));
            }

            // 吃食物
            for (let i = foods.length - 1; i >= 0; i--) {
                const f = foods[i];
                if (dist(me, f) < BALL_RADIUS + f.radius) {
                    foods.splice(i, 1);
                    foods.push({ ...rndPos(), radius: 6, color: rndColor() });
                    me.weight += 1;
                    updateLocalInfo();
                    syncPlayerData();
                }
            }

            // 碰撞判定：大球碰小球 → 大球弹开，小球减1血
            for (const id in players) {
                if (id === playerId || !players[id].alive) continue;
                const p = players[id];
                const d = dist(me, p);
                // 碰到边缘就触发：距离 < 两球半径之和
                if (d < BALL_RADIUS * 2) {
                    if (me.weight > p.weight) {
                        // 大球（me）被弹开，方向是远离小球（p）
                        const dx = me.x - p.x;
                        const dy = me.y - p.y;
                        const mag = Math.hypot(dx, dy);
                        if (mag > 0) {
                            const nx = dx / mag;
                            const ny = dy / mag;
                            // 触发弹开动画
                            startKnockbackAnimation(
                                playerId,
                                me.x, me.y,
                                me.x + nx * KNOCKBACK_DISTANCE,
                                me.y + ny * KNOCKBACK_DISTANCE
                            );
                            // 小球减1点生命
                            p.hp = Math.max(0, p.hp - 1);
                            roomChannel.trigger('client-playerHurt', { id: id, hp: p.hp });
                            if (p.hp <= 0) {
                                p.alive = false;
                                me.kill += 1;
                                updateLocalInfo();
                                roomChannel.trigger('client-playerKill', { victimId: id, killerId: playerId });
                            }
                            syncPlayerData();
                        }
                    }
                }
            }
        }

        // 开始弹开动画
        function startKnockbackAnimation(playerId, fromX, fromY, toX, toY) {
            knockbackAnimations[playerId] = {
                startTime: performance.now(),
                fromX, fromY,
                toX, toY
            };
            // 同步弹开动画到其他玩家
            if (roomChannel) {
                roomChannel.trigger('client-knockback', {
                    id: playerId,
                    fromX, fromY,
                    toX, toY
                });
            }
        }

        // 更新本地信息
        function updateLocalInfo() {
            const me = players[playerId];
            if (!me) return;
            document.getElementById('weightText').textContent = me.weight;
            document.getElementById('hpText').textContent = me.hp;
            document.getElementById('killText').textContent = me.kill;
        }

        // 更新排行榜
        function updateRank() {
            const panel = document.getElementById('rankPanel');
            const sortedPlayers = Object.values(players)
                .filter(p => p.alive)
                .sort((a, b) => b.kill - a.kill);
            
            panel.innerHTML = '';
            sortedPlayers.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'rank-item';
                item.innerHTML = `
                    <img class="rank-avatar" src="${p.avatar || 'https://i.imgur.com/8OKZ76D.png'}" alt="头像">
                    <div class="rank-name">${p.name}</div>
                    <div class="rank-kill">${p.kill}杀</div>
                `;
                panel.appendChild(item);
            });
        }

        // 主循环
        function gameLoop() {
            gameLogic();
            draw();
            updateRank();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // 摇杆控制
        const joystick = document.querySelector('.joystick');
        const joystickKnob = document.querySelector('.joystick-knob');
        joystick.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = joystick.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left - rect.width/2;
            const y = e.touches[0].clientY - rect.top - rect.height/2;
            const mag = Math.hypot(x, y);
            const max = rect.width/2 - 25;
            moveX = mag > max ? (x / mag) * max : x;
            moveY = mag > max ? (y / mag) * max : y;
            joystickKnob.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            const rect = joystick.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left - rect.width/2;
            const y = e.touches[0].clientY - rect.top - rect.height/2;
            const mag = Math.hypot(x, y);
            const max = rect.width/2 - 25;
            moveX = mag > max ? (x / mag) * max : x;
            moveY = mag > max ? (y / mag) * max : y;
            joystickKnob.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
        document.addEventListener('touchend', () => {
            moveX = 0;
            moveY = 0;
            joystickKnob.style.transform = 'translate(-50%, -50%)';
        });

        // 加速按钮
        const boostBtn = document.getElementById('boostBtn');
        let boostTimer = null;
        boostBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const me = players[playerId];
            if (!me || me.weight < 2 || !gameStarted) return;
            isBoost = true;
            me.weight -= 2;
            updateLocalInfo();
            syncPlayerData();
            boostTimer = setInterval(() => {
                if (me.weight >= 2) {
                    me.weight -= 2;
                    updateLocalInfo();
                    syncPlayerData();
                } else {
                    stopBoost();
                }
            }, 1000);
        });
        boostBtn.addEventListener('touchend', stopBoost);
        boostBtn.addEventListener('touchcancel', stopBoost);
        function stopBoost() {
            isBoost = false;
            clearInterval(boostTimer);
        }

        // 同步玩家数据
        function syncPlayerData() {
            const me = players[playerId];
            if (me && gameStarted && roomChannel) {
                roomChannel.trigger('client-playerSync', {
                    id: playerId,
                    x: me.x,
                    y: me.y,
                    weight: me.weight,
                    hp: me.hp,
                    kill: me.kill,
                    alive: me.alive
                });
            }
        }

        // Pusher初始化
        function initPusher() {
            pusher = new Pusher(PUSHER_KEY, { 
                cluster: PUSHER_CLUSTER,
                enableClientEventLogs: true
            });
            mainChannel = pusher.subscribe('ball-game-global');
            
            mainChannel.bind('client-roomList', (data) => {
                rooms = data;
                renderRoomList();
            });
            mainChannel.bind('client-roomCreated', (data) => {
                rooms[data.roomId] = data.roomData;
                renderRoomList();
            });
            mainChannel.bind('client-roomUpdated', (data) => {
                if (rooms[data.roomId]) {
                    rooms[data.roomId] = { ...rooms[data.roomId], ...data.roomData };
                }
                renderRoomList();
                if (currentRoomId === data.roomId) {
                    renderWaitingRoom();
                    if (data.roomData.isStarted) {
                        gameStarted = true;
                        enterGame();
                    }
                }
            });
            mainChannel.bind('client-roomDeleted', (roomId) => {
                delete rooms[roomId];
                renderRoomList();
                if (currentRoomId === roomId) {
                    alert('房间已被房主解散！');
                    resetGameState();
                    document.getElementById('waitingRoom').style.display = 'none';
                    document.getElementById('lobby').style.display = 'block';
                }
            });

            mainChannel.trigger('client-requestRoomList', {});
        }

        // 渲染房间列表
        function renderRoomList() {
            const roomList = document.getElementById('roomList');
            roomList.innerHTML = '';
            const validRooms = Object.entries(rooms).filter(([id, room]) => {
                return !room.isStarted && Object.keys(room.players).length < MAX_PLAYERS;
            });

            if (validRooms.length === 0) {
                roomList.innerHTML = '<div class="tip" style="padding:15px;">暂无可用房间，点击创建</div>';
                return;
            }

            validRooms.forEach(([roomId, room]) => {
                const playerCount = Object.keys(room.players).length;
                const hostName = room.players[room.hostId]?.name || '未知房主';
                const item = document.createElement('div');
                item.className = 'room-item';
                item.innerHTML = `
                    <div class="room-id">房间ID：${roomId}</div>
                    <div class="room-info">房主：${hostName} | ${playerCount}/${MAX_PLAYERS}人</div>
                `;
                item.onclick = () => joinRoom(roomId);
                roomList.appendChild(item);
            });
        }

        // 渲染等待房间
        function renderWaitingRoom() {
            const room = rooms[currentRoomId];
            if (!room) return;
            const playerCount = Object.keys(room.players).length;
            document.getElementById('roomInfo').textContent = `房间ID：${currentRoomId} | ${playerCount}/${MAX_PLAYERS}人`;
            const playerList = document.getElementById('playerList');
            playerList.innerHTML = '';

            Object.values(room.players).forEach(p => {
                const item = document.createElement('div');
                item.className = 'player-item';
                item.innerHTML = `${p.name} ${p.id === room.hostId ? '<span class="host-tag">[房主]</span>' : ''}`;
                playerList.appendChild(item);
            });

            // 单人即可开始游戏
            document.getElementById('startGameBtn').style.display = isHost ? 'block' : 'none';
            document.getElementById('startGameBtn').disabled = false;
        }

        // 创建房间
        document.getElementById('createRoomBtn').onclick = () => {
            playerName = document.getElementById('playerName').value.trim();
            if (!playerName) {
                alert('请输入有效的昵称！');
                return;
            }

            initPusher();
            currentRoomId = 'BALL-' + Math.random().toString(36).slice(2, 8).toUpperCase();
            playerId = 'P-' + Math.random().toString(36).slice(2, 12);
            isHost = true;

            const initialPlayer = {
                id: playerId,
                x: MAP_SIZE / 2,
                y: MAP_SIZE / 2,
                weight: 0,
                hp: MAX_HP,
                kill: 0,
                name: playerName,
                avatar: playerAvatar,
                alive: true,
                color: rndColor()
            };

            rooms[currentRoomId] = {
                hostId: playerId,
                players: { [playerId]: initialPlayer },
                isStarted: false
            };
            players = { [playerId]: initialPlayer };

            roomChannel = pusher.subscribe(currentRoomId);
            bindRoomChannelEvents();

            mainChannel.trigger('client-roomCreated', {
                roomId: currentRoomId,
                roomData: rooms[currentRoomId]
            });

            document.getElementById('lobby').style.display = 'none';
            document.getElementById('waitingRoom').style.display = 'block';
            renderWaitingRoom();
        };

        // 加入房间
        function joinRoom(roomId) {
            playerName = document.getElementById('playerName').value.trim();
            if (!playerName) {
                alert('请输入有效的昵称！');
                return;
            }
            if (!rooms[roomId]) {
                alert('房间不存在或已解散！');
                return;
            }

            initPusher();
            currentRoomId = roomId;
            playerId = 'P-' + Math.random().toString(36).slice(2, 12);
            isHost = false;

            roomChannel = pusher.subscribe(currentRoomId);
            bindRoomChannelEvents();

            const initialPlayer = {
                id: playerId,
                x: MAP_SIZE / 2 + Math.random() * 300,
                y: MAP_SIZE / 2 + Math.random() * 300,
                weight: 0,
                hp: MAX_HP,
                kill: 0,
                name: playerName,
                avatar: playerAvatar,
                alive: true,
                color: rndColor()
            };

            rooms[currentRoomId].players[playerId] = initialPlayer;
            players = rooms[currentRoomId].players;

            roomChannel.trigger('client-playerJoined', {
                playerId: playerId,
                playerData: initialPlayer
            });

            document.getElementById('lobby').style.display = 'none';
            document.getElementById('waitingRoom').style.display = 'block';
            renderWaitingRoom();
        }

        // 绑定房间频道事件
        function bindRoomChannelEvents() {
            roomChannel.bind('client-playerJoined', (data) => {
                players[data.playerId] = data.playerData;
                renderWaitingRoom();
                updateRoomToGlobal();
            });

            roomChannel.bind('client-playerLeft', (playerId) => {
                delete players[playerId];
                renderWaitingRoom();
                if (playerId === rooms[currentRoomId].hostId) {
                    roomChannel.trigger('client-roomDeleted', currentRoomId);
                    mainChannel.trigger('client-roomDeleted', currentRoomId);
                }
                updateRoomToGlobal();
            });

            roomChannel.bind('client-playerSync', (data) => {
                if (players[data.id]) {
                    players[data.id].x = data.x;
                    players[data.id].y = data.y;
                    players[data.id].weight = data.weight;
                    players[data.id].hp = data.hp;
                    players[data.id].kill = data.kill;
                    players[data.id].alive = data.alive;
                }
            });

            roomChannel.bind('client-playerHurt', (data) => {
                if (players[data.id]) {
                    players[data.id].hp = data.hp;
                }
            });

            roomChannel.bind('client-playerKill', (data) => {
                if (players[data.victimId]) players[data.victimId].alive = false;
                if (players[data.killerId]) players[data.killerId].kill += 1;
            });

            // 同步弹开动画
            roomChannel.bind('client-knockback', (data) => {
                startKnockbackAnimation(
                    data.id,
                    data.fromX, data.fromY,
                    data.toX, data.toY
                );
            });

            roomChannel.bind('client-gameStart', () => {
                rooms[currentRoomId].isStarted = true;
                gameStarted = true;
                updateRoomToGlobal();
                enterGame();
            });

            roomChannel.bind('client-roomDeleted', (roomId) => {
                mainChannel.trigger('client-roomDeleted', roomId);
            });
        }

        // 更新房间信息到全局频道
        function updateRoomToGlobal() {
            const room = rooms[currentRoomId];
            if (!room || !mainChannel) return;
            mainChannel.trigger('client-roomUpdated', {
                roomId: currentRoomId,
                roomData: {
                    players: room.players,
                    isStarted: room.isStarted
                }
            });
        }

        // 房主开始游戏（单人即可开始）
        document.getElementById('startGameBtn').onclick = () => {
            if (!isHost || !roomChannel) {
                alert('只有房主才能开始游戏！');
                return;
            }
            rooms[currentRoomId].isStarted = true;
            gameStarted = true;
            updateRoomToGlobal();
            roomChannel.trigger('client-gameStart', {});
        };

        // 离开房间
        document.getElementById('leaveRoomBtn').onclick = () => {
            if (roomChannel) {
                roomChannel.trigger('client-playerLeft', playerId);
                roomChannel.unsubscribe();
            }
            resetGameState();
            document.getElementById('waitingRoom').style.display = 'none';
            document.getElementById('lobby').style.display = 'block';
            if (mainChannel) mainChannel.trigger('client-requestRoomList', {});
        };

        // 进入游戏
        function enterGame() {
            initFood();
            updateLocalInfo();
            document.getElementById('waitingRoom').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            setInterval(syncPlayerData, 60);
        }

        // 重置游戏状态
        function resetGameState() {
            currentRoomId = null;
            isHost = false;
            gameStarted = false;
            players = {};
            foods = [];
            moveX = 0;
            moveY = 0;
            isBoost = false;
            knockbackAnimations = {};
            if (roomChannel) {
                roomChannel.unsubscribe();
                roomChannel = null;
            }
        }
    </script>
</body>
</html>
