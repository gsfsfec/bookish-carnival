<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PVZ 量子天启 · 直连版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,monospace}
body{background:#000;color:#fff;overflow:hidden}
/* 启动动画 */
.loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:center}
.quantum-title{font-size:24px;color:#0ff;text-shadow:0 0 10px #0ff,0 0 20px #0ff;margin-bottom:20px}
.progress-bar{width:300px;height:12px;border:2px solid #ff00ff;border-radius:6px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#0ff,#ff00ff);transition:width 0.03s}

/* 主界面 */
.container{max-width:520px;margin:0 auto;padding:16px;display:none}
.title{text-align:center;color:#0ff;text-shadow:0 0 10px #0ff;font-size:22px;margin:12px 0}
.panel{border:2px solid #ff00ff;border-radius:10px;padding:14px;margin:12px 0;background:#111}
.panel h3{color:#ff0;margin-bottom:10px}
input{width:100%;padding:10px;margin:6px 0;background:#222;border:1px solid #0ff;color:#fff;border-radius:6px}
button{width:100%;padding:12px;margin:6px 0;background:#ff00ff;color:#000;border:none;border-radius:6px;font-weight:bold}
button:active{background:#f0f}
.log{margin-top:10px;padding:10px;border-radius:6px;background:#000;color:#0f0;font-size:14px}
.warn{color:#ff0;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>

<!-- 量子启动动画 -->
<div class="loader" id="loader">
  <div class="quantum-title">PVZ 量子天启 · 初始化</div>
  <div class="progress-bar">
    <div class="progress-fill" id="fill"></div>
  </div>
</div>

<!-- 主界面 -->
<div class="container" id="app">
  <h2 class="title">量子重构单元 · 天启协议</h2>

  <div class="panel">
    <h3>协议配置</h3>
    <input type="text" id="token" placeholder="EADP-AUTH-TOKEN">
    <input type="text" id="pid" placeholder="EADP-PERSONA-ID">
  </div>

  <div class="panel">
    <h3>钻石量子生成</h3>
    <input type="number" id="gemTimes" value="1" min="1" max="10">
    <button onclick="doGem()">开始生成钻石</button>
    <div id="gemLog" class="log"></div>
  </div>

  <div class="panel">
    <h3>卡牌全量解锁</h3>
    <input type="number" id="cardNum" value="999999" min="1" max="1000000">
    <button onclick="doCard()">解锁全卡牌</button>
    <div id="cardLog" class="log"></div>
  </div>

  <div class="warn">
    仅供学习交流 | 已启用直连模式，无需额外配置
  </div>
</div>

<script>
// 启动动画
async function startAnimation() {
  const fill = document.getElementById('fill')
  for (let i = 0; i <= 100; i++) {
    fill.style.width = i + '%'
    await new Promise(r => setTimeout(r, 25))
  }
  document.getElementById('loader').style.display = 'none'
  document.getElementById('app').style.display = 'block'
}
startAnimation()

// 钻石生成（使用 no-cors 模式，直接绕过跨域检查）
async function doGem() {
  const T = document.getElementById('token').value
  const P = document.getElementById('pid').value
  const N = parseInt(document.getElementById('gemTimes').value)
  const L = document.getElementById('gemLog')
  if (!T || !P) { L.innerHTML = '请填写TOKEN和PID'; return }
  L.innerHTML = '🔄 执行中...'
  let ok = 0
  for (let i = 0; i < N; i++) {
    try {
      const u = Date.now()
      await fetch('https://pvz-heroes.awspopcap.com/updateDailyLoginProgress?userId=' + P, {
        method: 'POST',
        mode: 'no-cors', // 关键：绕过跨域限制
        headers: {
          'Content-Type': 'application/json',
          'EADP-AUTH-TOKEN': T,
          'EADP-PERSONA-ID': P,
          'X-EADP-Client-Id': 'pvzheroes-2015-google-client',
          'X-Pvzh-Platform': 'Android',
          'X-Pvzh-Content-Version': '45a337051e72592e53c9bf8a4b590639',
          'X-Pvzh-Client-Version': '1.64.6',
          'X-Pvzh-UTC': u + ''
        },
        body: '{"day":1,"forStreak":true,"currentStreakSetCompleted":false}'
      })
      await fetch('https://pvz-heroes.awspopcap.com/pvp/v1/leagueRewards/sync?playerId=' + P, {
        method: 'POST',
        mode: 'no-cors', // 关键：绕过跨域限制
        headers: {
          'Content-Type': 'application/json',
          'EADP-AUTH-TOKEN': T,
          'EADP-PERSONA-ID': P,
          'X-EADP-Client-Id': 'pvzheroes-2015-google-client',
          'X-Pvzh-Platform': 'Android',
          'X-Pvzh-Content-Version': '45a337051e72592e53c9bf8a4b590639',
          'X-Pvzh-Client-Version': '1.64.6',
          'X-Pvzh-UTC': u + ''
        },
        body: '{"tickets":0,"gems":10000,"sparks":0,"packs":[],"specificCards":[]}'
      })
      ok++
      L.innerHTML = `完成 ${ok}/${N} 次 | 每次10000钻石`
      await new Promise(r => setTimeout(r, 600))
    } catch (e) {
      L.innerHTML = `第${i+1}次失败: ${e.message}`
      await new Promise(r => setTimeout(r, 600))
    }
  }
  L.innerHTML = `全部完成 ${ok}/${N} 次`
}

      headers: {

    // no-cors模式下无法读取响应状态，直接提示操作已发送

  }

</script>
</body>
</html>
