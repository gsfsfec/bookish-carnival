<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>球球大乱斗 | 稳定最终版</title>
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background:#121212; color:#fff; overflow:hidden; }
        
        .container { 
            position: absolute; 
            top:50%; left:50%; 
            transform:translate(-50%,-50%); 
            background:rgba(22,22,22,0.95); 
            border-radius:20px; 
            padding:25px; 
            box-shadow:0 0 30px rgba(0,0,0,0.7); 
            width: 340px;
        }
        .title { font-size:28px; margin-bottom:20px; text-align:center; color:#4CAF50; }
        .input { 
            width:100%; 
            padding:14px; 
            margin:8px 0; 
            border:none; 
            border-radius:12px; 
            background:#333; 
            color:#fff; 
            font-size:16px; 
            outline:none;
        }
        .button { 
            width:100%; 
            padding:14px; 
            margin:8px 0; 
            border:none; 
            border-radius:12px; 
            background:#4CAF50; 
            color:#fff; 
            font-size:16px; 
            font-weight:bold; 
            cursor:pointer; 
        }
        .button-red { background:#f44336; }
        .button-orange { background:#ff9800; }
        .tip { font-size:14px; color:#ccc; margin-top:8px; text-align:center; }

        #roomList {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            border-radius:12px;
            border:1px solid #444;
            background:#1a1a1a;
        }
        .room-item {
            padding:12px 14px;
            border-bottom:1px solid #333;
            cursor:pointer;
        }
        .room-item:hover { background:#2a2a2a; }
        .room-item:last-child { border-bottom:none; }
        .room-id { font-weight:bold; color:#4CAF50; font-size:15px; }
        .room-info { font-size:13px; color:#ccc; margin-top:4px; }

        #waitingRoom { display:none; text-align:center; }
        #playerList { 
            max-height:180px; 
            overflow-y:auto; 
            margin:12px 0; 
            padding:10px; 
            border-radius:12px; 
            background:#222; 
        }
        .player-item { 
            display: flex; align-items:center; gap:8px;
            padding:8px 0; font-size:15px; border-bottom:1px solid #333; 
        }
        .player-avatar {
            width:32px; height:32px; border-radius:50%; object-fit:cover;
        }
        .player-item:last-child { border-bottom:none; }
        .host-tag { color:#ff9800; font-size:12px; margin-left:6px; }

        #game { display:none; width:100vw; height:100vh; position:relative; }
        #gameCanvas { width:100%; height:100%; background:#121212; touch-action:none; position:absolute; top:0; left:0; }

        #rankPanel { 
            position:absolute; right:8px; top:8px; 
            width:140px; background:rgba(0,0,0,0.7); 
            border-radius:8px; padding:8px; 
            max-height:70vh; overflow-y:auto; z-index:100; 
        }
        .rank-item { display:flex; align-items:center; gap:6px; padding:4px 0; font-size:12px; white-space:nowrap; }
        .rank-avatar { width:24px; height:24px; border-radius:50%; object-fit:cover; background:#444; }
        .rank-name { flex:1; overflow:hidden; text-overflow:ellipsis; }
        .rank-kill { color:#ff9800; font-weight:bold; }

        #spectatePanel {
            position:absolute; right:8px; top:calc(8px + 70vh + 10px);
            width:140px; background:rgba(0,0,0,0.8); border-radius:8px; padding:8px;
            max-height:20vh; overflow-y:auto; z-index:100; display:none;
        }
        .spectate-title { font-size:12px; color:#ff9800; margin-bottom:4px; text-align:center; }
        .spectate-item { font-size:12px; color:#ccc; padding:2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        #topInfo { position:absolute; top:8px; left:8px; display:flex; gap:15px; font-size:16px; font-weight:bold; text-shadow:0 0 6px #000; z-index:100; }
        #spectateExitBtn {
            position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
            background:#f44336; color:#fff; border:none; border-radius:12px;
            padding:10px 20px; font-size:16px; font-weight:bold; z-index:101; display:none;
        }

        #winPopup {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.9); border-radius:20px; padding:30px 40px;
            text-align:center; z-index:999; display:none;
        }
        .win-text { font-size:32px; color:#ffdf40; font-weight:bold; margin-bottom:20px; }
        .win-name { font-size:24px; color:#fff; margin-bottom:20px; }
        #winBackBtn { background:#4CAF50; color:#fff; border:none; border-radius:12px; padding:12px 24px; font-size:18px; font-weight:bold; }

        .joystick { position:absolute; bottom:25px; left:25px; width:120px; height:120px; background:rgba(255,255,255,0.15); border-radius:50%; z-index:100; }
        .joystick-knob { position:absolute; top:50%; left:50%; width:40px; height:40px; background:#fff; border-radius:50%; transform:translate(-50%,-50%); z-index:101; }
        #boostBtn {
            position:absolute; bottom:25px; right:25px;
            width:70px; height:70px; background:#ff5722;
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:16px; font-weight:bold; color:#fff; z-index:100;
        }
    </style>
</head>
<body>

<div id="lobby" class="container">
    <h1 class="title">球球大乱斗</h1>
    <input id="playerName" class="input" placeholder="输入你的昵称" value="玩家">
    <input id="roomInput" class="input" placeholder="输入6位房间号">
    <button id="joinByRoomIdBtn" class="button button-orange">输入房间号加入</button>
    <button id="createRoomBtn" class="button">创建房间</button>
    <div class="tip">房间列表（实时刷新）</div>
    <div id="roomList"></div>
</div>

<div id="waitingRoom" class="container">
    <h1 class="title">等待房间</h1>
    <div id="roomInfo" class="tip"></div>
    <input type="file" id="avatarInput" accept="image/*" style="display:none;">
    <button id="changeAvatarBtn" class="button">选择头像</button>
    <div id="playerList"></div>
    <button id="startGameBtn" class="button button-orange">开始游戏</button>
    <button id="leaveRoomBtn" class="button button-red">离开房间</button>
</div>

<div id="game">
    <div id="topInfo">
        <div>重量: <span id="weightText">0</span></div>
        <div>血量: <span id="hpText">3</span></div>
        <div>击杀: <span id="killText">0</span></div>
    </div>
    <div id="rankPanel"></div>
    <div id="spectatePanel">
        <div class="spectate-title">观战列表</div>
        <div id="spectateList"></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="joystick"><div class="joystick-knob"></div></div>
    <div id="boostBtn">加速</div>
    <button id="spectateExitBtn">退出观战</button>
</div>

<div id="winPopup">
    <div class="win-text">胜利!</div>
    <div class="win-name" id="winName"></div>
    <button id="winBackBtn">返回大厅</button>
</div>

<script>
const PUSHER_KEY = '34b4edd6678d7440e600';
const PUSHER_CLUSTER = 'ap3';
const MAP_SIZE = 5000;
const NORMAL_SPEED = 5;
const BOOST_SPEED = 10;
const MAX_HP = 3;
const MAX_PLAYERS = 40;
const BALL_RADIUS = 60;
const KNOCKBACK_BASE = 240;
const KNOCKBACK_DURATION = 200;
const INVULNERABLE_DURATION = 2000;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let canvasDPR = window.devicePixelRatio || 1;

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.scale(dpr, dpr);
    canvasDPR = dpr;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let pusher, mainChannel, roomChannel;
let playerId, playerName, playerAvatar = null;
let currentRoomId = null;
let isHost = false;
let gameStarted = false;
let isSpectate = false;

let rooms = {};
let players = {};
let foods = [];
let moveX = 0, moveY = 0;
let isBoost = false;
let camera = { x: MAP_SIZE/2, y: MAP_SIZE/2, zoom: 0.166667 };
let knockbackAnimations = {};

// 观战视角
let pinchStartDist = 0;
let lastTouch = null;
canvas.addEventListener('touchmove', (e) => {
    if (!isSpectate) return;
    if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (pinchStartDist > 0) {
            camera.zoom *= dist / pinchStartDist;
            camera.zoom = Math.max(0.08, Math.min(0.4, camera.zoom));
        }
        pinchStartDist = dist;
        e.preventDefault();
    }
    if (e.touches.length === 1) {
        const t = e.touches[0];
        if (lastTouch) {
            camera.x -= (t.clientX - lastTouch.x) / camera.zoom;
            camera.y -= (t.clientY - lastTouch.y) / camera.zoom;
        }
        lastTouch = { x: t.clientX, y: t.clientY };
    }
});
canvas.addEventListener('touchend', () => { pinchStartDist = 0; lastTouch = null; });

// 头像上传
document.getElementById('changeAvatarBtn').onclick = () => {
    document.getElementById('avatarInput').click();
};
document.getElementById('avatarInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        playerAvatar = ev.target.result;
        if (roomChannel) {
            roomChannel.trigger('client-updateAvatar', { id: playerId, avatar: playerAvatar });
        }
    };
    reader.readAsDataURL(file);
};

// 初始化Pusher
function initPusher() {
    if (pusher) return;
    pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
    mainChannel = pusher.subscribe('ball-game-global');

    mainChannel.bind('client-roomList', (data) => {
        rooms = data;
        renderRoomList();
    });
    mainChannel.bind('client-roomCreated', (data) => {
        rooms[data.roomId] = data.roomData;
        renderRoomList();
    });
    mainChannel.bind('client-roomUpdated', (data) => {
        if (rooms[data.roomId]) {
            rooms[data.roomId] = { ...rooms[data.roomId], ...data.roomData };
        }
        renderRoomList();
        if (currentRoomId === data.roomId) {
            renderPlayerList();
            if (data.roomData.isStarted && !gameStarted) {
                gameStarted = true;
                enterGame();
            }
        }
    });
    mainChannel.bind('client-roomDeleted', (roomId) => {
        delete rooms[roomId];
        renderRoomList();
        if (currentRoomId === roomId) {
            alert('房间已解散');
            resetToLobby();
        }
    });

    setInterval(() => {
        mainChannel.trigger('client-requestRoomList', {});
    }, 1500);
}

// 6位房间号
function generateRoomId() {
    return Math.floor(100000 + Math.random() * 900000).toString();
}

// 房间列表
function renderRoomList() {
    const list = document.getElementById('roomList');
    list.innerHTML = '';
    const validRooms = Object.entries(rooms).filter(([id, r]) => {
        return !r.isStarted && Object.keys(r.players).length < MAX_PLAYERS;
    });
    if (validRooms.length === 0) {
        list.innerHTML = '<div class="tip" style="padding:12px;">暂无房间</div>';
        return;
    }
    validRooms.forEach(([id, room]) => {
        const count = Object.keys(room.players).length;
        const hostName = room.players[room.hostId]?.name || '未知房主';
        const item = document.createElement('div');
        item.className = 'room-item';
        item.innerHTML = `
            <div class="room-id">房间号：${id}</div>
            <div class="room-info">${hostName}  ${count}/${MAX_PLAYERS}</div>
        `;
        item.onclick = () => joinRoomById(id);
        list.appendChild(item);
    });
}

// 创建房间
document.getElementById('createRoomBtn').onclick = () => {
    playerName = document.getElementById('playerName').value.trim();
    if (!playerName) { alert('请输入昵称'); return; }
    initPusher();
    currentRoomId = generateRoomId();
    playerId = 'P-' + Math.random().toString(36).slice(2,12);
    isHost = true;
    const newPlayer = {
        id: playerId,
        x: MAP_SIZE/2, y: MAP_SIZE/2,
        weight: 0, hp: MAX_HP, kill:0,
        name: playerName,
        avatar: playerAvatar,
        alive: true,
        color: `hsl(${Math.random()*360},80%,60%)`,
        invulnerableUntil: 0
    };
    rooms[currentRoomId] = {
        hostId: playerId,
        players: { [playerId]: newPlayer },
        isStarted: false
    };
    players = { [playerId]: newPlayer };
    roomChannel = pusher.subscribe(currentRoomId);
    bindRoomEvent();
    mainChannel.trigger('client-roomCreated', { roomId: currentRoomId, roomData: rooms[currentRoomId] });
    showWaitingRoom();
};

// 输入房间号加入
document.getElementById('joinByRoomIdBtn').onclick = () => {
    playerName = document.getElementById('playerName').value.trim();
    const roomId = document.getElementById('roomInput').value.trim();
    if (!playerName) { alert('请输入昵称'); return; }
    if (!/^\d{6}$/.test(roomId)) { alert('请输入6位数字房间号'); return; }
    initPusher();
    joinRoomById(roomId);
};

// 加入房间
function joinRoomById(roomId) {
    if (!rooms[roomId]) { alert('房间不存在'); return; }
    if (rooms[roomId].isStarted) { alert('游戏已开始'); return; }
    if (Object.keys(rooms[roomId].players).length >= MAX_PLAYERS) { alert('房间已满'); return; }

    currentRoomId = roomId;
    playerId = 'P-' + Math.random().toString(36).slice(2,12);
    isHost = false;
    roomChannel = pusher.subscribe(currentRoomId);
    bindRoomEvent();
    const newPlayer = {
        id: playerId,
        x: MAP_SIZE/2 + (Math.random()-0.5)*600,
        y: MAP_SIZE/2 + (Math.random()-0.5)*600,
        weight:0, hp:MAX_HP, kill:0,
        name: playerName,
        avatar: playerAvatar,
        alive: true,
        color: `hsl(${Math.random()*360},80%,60%)`,
        invulnerableUntil:0
    };
    rooms[currentRoomId].players[playerId] = newPlayer;
    players = rooms[currentRoomId].players;
    roomChannel.trigger('client-playerJoined', { playerId, playerData: newPlayer });
    showWaitingRoom();
}

// 房间事件
function bindRoomEvent() {
    roomChannel.bind('client-playerJoined', (data) => {
        players[data.playerId] = data.playerData;
        renderPlayerList();
        updateRoomGlobal();
    });
    roomChannel.bind('client-playerLeft', (id) => {
        delete players[id];
        renderPlayerList();
        if (id === rooms[currentRoomId].hostId) {
            roomChannel.trigger('client-roomDeleted', currentRoomId);
            mainChannel.trigger('client-roomDeleted', currentRoomId);
        }
        updateRoomGlobal();
    });
    roomChannel.bind('client-updateAvatar', (data) => {
        if (players[data.id]) {
            players[data.id].avatar = data.avatar;
            renderPlayerList();
        }
    });
    roomChannel.bind('client-playerSync', (data) => {
        if (players[data.id]) {
            players[data.id].x = data.x;
            players[data.id].y = data.y;
            players[data.id].weight = data.weight;
            players[data.id].hp = data.hp;
            players[data.id].kill = data.kill;
            players[data.id].alive = data.alive;
            players[data.id].invulnerableUntil = data.invulnerableUntil;
        }
    });
    roomChannel.bind('client-knockback', (data) => {
        knockbackAnimations[data.id] = {
            startTime: performance.now(),
            fromX: data.fx, fromY: data.fy,
            toX: data.tx, toY: data.ty
        };
    });
    roomChannel.bind('client-gameStart', () => {
        if (!gameStarted) {
            rooms[currentRoomId].isStarted = true;
            gameStarted = true;
            enterGame();
        }
    });
    roomChannel.bind('client-gameWin', (data) => {
        showWin(data.winnerName);
    });
}

function updateRoomGlobal() {
    if (!rooms[currentRoomId] || !mainChannel) return;
    mainChannel.trigger('client-roomUpdated', {
        roomId: currentRoomId,
        roomData: { players: rooms[currentRoomId].players, isStarted: rooms[currentRoomId].isStarted }
    });
}

// 房间内玩家列表
function renderPlayerList() {
    const list = document.getElementById('playerList');
    list.innerHTML = '';
    const count = Object.keys(players).length;
    document.getElementById('roomInfo').textContent = `房间：${currentRoomId}  ${count}/${MAX_PLAYERS}`;
    Object.values(players).forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-item';
        div.innerHTML = `
            <img class="player-avatar" src="${p.avatar || 'https://i.imgur.com/8OKZ76D.png'}">
            <div style="flex:1;text-align:left">${p.name}</div>
            ${p.id === rooms[currentRoomId].hostId ? '<span class="host-tag">[房主]</span>' : ''}
        `;
        list.appendChild(div);
    });
    document.getElementById('startGameBtn').style.display = isHost ? 'block' : 'none';
}

document.getElementById('startGameBtn').onclick = () => {
    if (!isHost) return;
    rooms[currentRoomId].isStarted = true;
    gameStarted = true;
    roomChannel.trigger('client-gameStart', {});
    updateRoomGlobal();
    enterGame();
};

document.getElementById('leaveRoomBtn').onclick = resetToLobby;
document.getElementById('spectateExitBtn').onclick = resetToLobby;
document.getElementById('winBackBtn').onclick = resetToLobby;

function resetToLobby() {
    if (roomChannel) {
        roomChannel.trigger('client-playerLeft', playerId);
        roomChannel.unsubscribe();
    }
    currentRoomId = null;
    isHost = false;
    gameStarted = false;
    isSpectate = false;
    playerAvatar = null;
    players = {};
    foods = [];
    knockbackAnimations = {};
    document.getElementById('lobby').style.display = 'block';
    document.getElementById('waitingRoom').style.display = 'none';
    document.getElementById('game').style.display = 'none';
    document.getElementById('winPopup').style.display = 'none';
}

function showWaitingRoom() {
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('waitingRoom').style.display = 'block';
    document.getElementById('game').style.display = 'none';
    renderPlayerList();
}

// 游戏逻辑
function initFood() {
    foods = [];
    for(let i=0;i<50;i++){
        foods.push({
            x:200+Math.random()*(MAP_SIZE-400),
            y:200+Math.random()*(MAP_SIZE-400),
            radius:16,
            color:`hsl(${Math.random()*360},80%,60%)`
        });
    }
}

function updateCamera() {
    const me = players[playerId];
    if (!me || isSpectate) return;
    camera.x = me.x;
    camera.y = me.y;
}

function checkWin() {
    const alives = Object.values(players).filter(p=>p.alive);
    if (alives.length === 1) {
        const winner = alives[0];
        roomChannel.trigger('client-gameWin', { winnerName: winner.name });
        showWin(winner.name);
    }
}

function showWin(name) {
    document.getElementById('winName').textContent = name;
    document.getElementById('winPopup').style.display = 'block';
}

// 绘制球体、头像、名字、血条、重量
function draw() {
    if (!gameStarted) return;
    const me = players[playerId];
    if (!me) return;
    ctx.clearRect(0,0,canvas.width/canvasDPR,canvas.height/canvasDPR);
    ctx.save();
    const cx = canvas.width/(2*canvasDPR);
    const cy = canvas.height/(2*canvasDPR);
    ctx.translate(cx,cy);
    ctx.scale(camera.zoom,camera.zoom);
    ctx.translate(-camera.x,-camera.y);

    ctx.strokeStyle='#444'; ctx.lineWidth=8;
    ctx.strokeRect(0,0,MAP_SIZE,MAP_SIZE);

    foods.forEach(f=>{
        ctx.beginPath();
        ctx.fillStyle=f.color;
        ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);
        ctx.fill();
        ctx.closePath();
    });

    const now = performance.now();
    for(const id in knockbackAnimations){
        const a = knockbackAnimations[id];
        const t = Math.min(1,(now-a.startTime)/KNOCKBACK_DURATION);
        const et = t*(2-t);
        if(players[id]){
            players[id].x = a.fromX + (a.toX-a.fromX)*et;
            players[id].y = a.fromY + (a.toY-a.fromY)*et;
        }
        if(t>=1) delete knockbackAnimations[id];
    }

    for(const id in players){
        const p = players[id];
        if(!p.alive) continue;

        const invul = p.invulnerableUntil && now < p.invulnerableUntil;
        const color = p.color || '#4CAF50';
        const fill = invul ? 'rgba(100,149,237,0.7)' : color;

        // 球体
        ctx.beginPath();
        ctx.fillStyle = fill;
        ctx.arc(p.x, p.y, BALL_RADIUS, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.closePath();

        // 头像
        if (p.avatar) {
            const img = new Image();
            img.src = p.avatar;
            ctx.save();
            ctx.beginPath();
            ctx.arc(p.x, p.y, BALL_RADIUS*0.6, 0, Math.PI*2);
            ctx.clip();
            ctx.drawImage(img, p.x-BALL_RADIUS*0.6, p.y-BALL_RADIUS*0.6, BALL_RADIUS*1.2, BALL_RADIUS*1.2);
            ctx.restore();
        }

        // 名字
        ctx.font = 'bold 24px Arial';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - BALL_RADIUS - 60);

        // 信息
        ctx.font = '20px Arial';
        ctx.fillText(`重量:${p.weight}  血量:${p.hp}`, p.x, p.y - BALL_RADIUS - 30);
    }
    ctx.restore();
}

function gameLogic(){
    if(!gameStarted) return;
    const me = players[playerId];
    if(!me) return;

    // 死亡观战
    if(me.alive===false && !isSpectate){
        isSpectate=true;
        document.querySelector('.joystick').style.display='none';
        document.getElementById('boostBtn').style.display='none';
        document.getElementById('topInfo').style.display='none';
        document.getElementById('spectatePanel').style.display='block';
        document.getElementById('spectateExitBtn').style.display='block';
    }

    // 移动
    if(me.alive && !isSpectate){
        const sp = isBoost ? BOOST_SPEED : NORMAL_SPEED;
        if(moveX || moveY){
            const mg = Math.hypot(moveX, moveY);
            me.x += (moveX/mg)*sp;
            me.y += (moveY/mg)*sp;
        }
        me.x = Math.max(BALL_RADIUS, Math.min(MAP_SIZE-BALL_RADIUS, me.x));
        me.y = Math.max(BALL_RADIUS, Math.min(MAP_SIZE-BALL_RADIUS, me.y));
        updateCamera();

        // 吃食物
        for(let i=foods.length-1;i>=0;i--){
            const f=foods[i];
            if(Math.hypot(me.x-f.x, me.y-f.y) < BALL_RADIUS+f.radius){
                foods.splice(i,1);
                foods.push({
                    x:200+Math.random()*(MAP_SIZE-400),
                    y:200+Math.random()*(MAP_SIZE-400),
                    radius:16,
                    color:`hsl(${Math.random()*360},80%,60%)`
                });
                me.weight++;
                updateLocalInfo();
                syncPlayer();
            }
        }
    }

    // 碰撞
    const ids=Object.keys(players);
    for(let i=0;i<ids.length;i++){
        const ida=ids[i];
        const pa=players[ida];
        if(!pa.alive) continue;
        for(let j=i+1;j<ids.length;j++){
            const idb=ids[j];
            const pb=players[idb];
            if(!pb.alive) continue;
            const d=Math.hypot(pa.x-pb.x, pa.y-pb.y);
            if(d < BALL_RADIUS*2){
                const now=performance.now();
                const aInv=pa.invulnerableUntil && now<pa.invulnerableUntil;
                const bInv=pb.invulnerableUntil && now<pb.invulnerableUntil;
                const canDmg=!aInv && !bInv;

                const dx=pa.x-pb.x, dy=pa.y-pb.y;
                const mg=Math.hypot(dx,dy)||1;
                const nx=dx/mg, ny=dy/mg;
                const total=pa.weight+pb.weight||1;
                const ka=KNOCKBACK_BASE*(pb.weight/total);
                const kb=KNOCKBACK_BASE*(pa.weight/total);

                knockbackAnimations[ida]={startTime:now,fromX:pa.x,fromY:pa.y,toX:pa.x+nx*ka,toY:pa.y+ny*ka};
                knockbackAnimations[idb]={startTime:now,fromX:pb.x,fromY:pb.y,toX:pb.x-nx*kb,toY:pb.y-ny*kb};

                pa.invulnerableUntil=now+INVULNERABLE_DURATION;
                pb.invulnerableUntil=now+INVULNERABLE_DURATION;

                if(canDmg){
                    if(pa.weight>pb.weight){
                        pb.hp=Math.max(0,pb.hp-1);
                        if(pb.hp<=0){pb.alive=false;pa.kill++;}
                    }else if(pb.weight>pa.weight){
                        pa.hp=Math.max(0,pa.hp-1);
                        if(pa.hp<=0){pa.alive=false;pb.kill++;}
                    }else{
                        pa.hp=Math.max(0,pa.hp-1);
                        pb.hp=Math.max(0,pb.hp-1);
                        if(pa.hp<=0)pa.alive=false;
                        if(pb.hp<=0)pb.alive=false;
                    }
                    checkWin();
                    syncPlayer();
                }
            }
        }
    }
}

function updateLocalInfo(){
    const me=players[playerId];
    if(!me||isSpectate) return;
    document.getElementById('weightText').textContent=me.weight;
    document.getElementById('hpText').textContent=me.hp;
    document.getElementById('killText').textContent=me.kill;
}

// 排名 + 观战列表
function updateRankAndSpec(){
    const rank=document.getElementById('rankPanel');
    rank.innerHTML='';
    const alives=Object.values(players).filter(p=>p.alive).sort((a,b)=>b.kill-a.kill);
    alives.forEach(p=>{
        const div=document.createElement('div');
        div.className='rank-item';
        div.innerHTML=`
            <img class="rank-avatar" src="${p.avatar || 'https://i.imgur.com/8OKZ76D.png'}">
            <div class="rank-name">${p.name}</div>
            <div class="rank-kill">${p.kill}杀</div>
        `;
        rank.appendChild(div);
    });

    const specList=document.getElementById('spectateList');
    specList.innerHTML='';
    const specs=Object.values(players).filter(p=>!p.alive);
    specs.forEach(p=>{
        const div=document.createElement('div');
        div.className='spectate-item';
        div.textContent=p.name;
        specList.appendChild(div);
    });
}

function syncPlayer(){
    const me=players[playerId];
    if(me&&gameStarted&&roomChannel){
        roomChannel.trigger('client-playerSync',{
            id:playerId,
            x:me.x,y:me.y,
            weight:me.weight,
            hp:me.hp,
            kill:me.kill,
            alive:me.alive,
            invulnerableUntil:me.invulnerableUntil
        });
    }
}

// 摇杆
const joy=document.querySelector('.joystick');
const knob=document.querySelector('.joystick-knob');
joy.addEventListener('touchstart',(e)=>{e.preventDefault();});
joy.addEventListener('touchmove',(e)=>{
    e.preventDefault();
    if(!gameStarted||isSpectate) return;
    const r=joy.getBoundingClientRect();
    const x=e.touches[0].clientX-r.left-r.width/2;
    const y=e.touches[0].clientY-r.top-r.height/2;
    const mg=Math.hypot(x,y);
    const mx=r.width/2-20;
    moveX=mg>mx?(x/mg)*mx:x;
    moveY=mg>mx?(y/mg)*mx:y;
    knob.style.transform=`translate(${moveX}px,${moveY}px)`;
});
joy.addEventListener('touchend',()=>{moveX=0;moveY=0;knob.style.transform='translate(-50%,-50%)';});

// 加速
const boostBtn=document.getElementById('boostBtn');
let boostTimer;
boostBtn.addEventListener('touchstart',(e)=>{
    e.preventDefault();
    const me=players[playerId];
    if(!me||me.weight<2||isSpectate) return;
    isBoost=true;me.weight-=2;updateLocalInfo();syncPlayer();
    boostTimer=setInterval(()=>{
        if(me.weight>=2){me.weight-=2;updateLocalInfo();syncPlayer();}
        else isBoost=false;
    },1000);
});
boostBtn.addEventListener('touchend',()=>{isBoost=false;clearInterval(boostTimer);});

function gameLoop(){
    gameLogic();
    draw();
    updateRankAndSpec();
    requestAnimationFrame(gameLoop);
}

function enterGame(){
    initFood();
    updateCamera();
    updateLocalInfo();
    document.getElementById('waitingRoom').style.display='none';
    document.getElementById('game').style.display='block';
    gameLoop();
    setInterval(syncPlayer,60);
}

initPusher();
</script>
